name: kakao-digest APK

on:
  push:
    paths:
      - "kakao-digest/**"
      - ".github/workflows/kakao-digest.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kakao-digest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kakao-digest-apk
          path: kakao-digest/app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect APK (manifest, signature)
        if: always()
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$BT/aapt2" dump badging "$APK" | head -30
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -iE "testOnly|debuggable|minSdk|targetSdk" || true
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -20
