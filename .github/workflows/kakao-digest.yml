name: kakao-digest APK

on:
  push:
    paths:
      - "kakao-digest/**"
      - ".github/workflows/kakao-digest.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kakao-digest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kakao-digest-apk
          path: kakao-digest/app/build/outputs/apk/debug/app-debug.apk
